name: Deploy to GAS

# dev / prod ブランチへPRがマージされたときだけ実行する。
# （PRタイトルをデプロイ説明文に使いたいので push ではなく pull_request を使う）
#
# デプロイ先は「マージ先ブランチ」で切り替える:
#   dev  → verification 環境（検証用ワークスペース）
#   prod → production 環境（本番ワークスペース）
# scriptId / deploymentId は GitHub Environments 側の変数で環境ごとに持たせる。
#
# clasp が GAS へ push するのは src/ 配下だけ（.clasp.json の rootDir: src）。
# README・.github/・slack/manifest.yml（Slackへ手動反映）はデプロイ内容に影響しないため、
# paths で src/ の変更を含むPRに限定し、ドキュメントのみのPRでは無駄なデプロイをしない。
on:
  pull_request:
    types: [closed]
    branches: [dev, prod]
    paths:
      - "src/**"

# 同じ環境向けが同時に複数走らないように直列化（連続マージ時のデプロイ競合を防ぐ）。
# dev と prod は別グループにして互いをブロックしない。
concurrency:
  group: gas-deploy-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    # マージされたPRのときだけ。単にcloseされた（マージされていない）PRでは動かさない
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    # マージ先が prod なら production 環境、それ以外（dev）は verification 環境。
    # この environment に紐づく変数（SCRIPT_ID / DEPLOYMENT_ID）が下の vars.* で解決される。
    environment: ${{ github.event.pull_request.base.ref == 'prod' && 'production' || 'verification' }}
    steps:
      - name: Validate deploy target
        # 選ばれた環境に SCRIPT_ID / DEPLOYMENT_ID が未登録だと、clasp が
        # 意味不明なエラーで落ちて原因が分かりにくい。ここで理由つきで先に落とす。
        # （例: production 環境の変数が未設定のまま prod へマージした場合）
        run: |
          if [ -z "${SCRIPT_ID}" ] || [ -z "${DEPLOYMENT_ID}" ]; then
            echo "::error::環境 '${{ github.event.pull_request.base.ref == 'prod' && 'production' || 'verification' }}' に SCRIPT_ID / DEPLOYMENT_ID が未設定です。GitHub の Settings > Environments で登録してください。"
            exit 1
          fi
        env:
          SCRIPT_ID: ${{ vars.SCRIPT_ID }}
          DEPLOYMENT_ID: ${{ vars.DEPLOYMENT_ID }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install clasp
        # CI実績が豊富でトークン形式が安定している 2.4.2 に固定
        run: npm install -g @google/clasp@2.4.2

      - name: Write clasp credentials
        # clasp login で生成した ~/.clasprc.json の中身をSecretから復元
        run: echo "$CLASPRC_JSON" > "$HOME/.clasprc.json"
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}

      - name: Validate clasp credentials
        # 認証エラーの切り分け用。Secretが空/壊れていると次の push は
        # 「Could not read API credentials」としか出さず原因が分からないため、
        # ここで理由つきで先に落とす。
        # トークンの値は一切出力せず、必要なキーの有無だけを確認する（秘匿情報を漏らさない）
        run: |
          if [ ! -s "$HOME/.clasprc.json" ]; then
            echo "::error::~/.clasprc.json が空です。GitHub Secret CLASPRC_JSON が未設定/空の可能性があります（gh secret set CLASPRC_JSON < ~/.clasprc.json を実行）"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            let c;
            try { c = JSON.parse(fs.readFileSync(process.env.HOME + "/.clasprc.json", "utf8")); }
            catch (e) { console.error("::error::clasprc.json が有効なJSONではありません: " + e.message); process.exit(1); }
            const t = c && c.token;
            if (!t || !t.access_token || !t.refresh_token) {
              console.error("::error::clasprc.json に token.access_token / refresh_token がありません（clasp 2.4.2 の形式で保存されているか確認）");
              process.exit(1);
            }
            console.log("clasprc OK: token.access_token/refresh_token あり, isLocalCreds=" + c.isLocalCreds);
          '

      - name: Write .clasp.json
        # scriptId はVariableから。コードは src/ 配下なので rootDir を src に
        run: |
          cat > .clasp.json <<EOF
          {
            "scriptId": "${SCRIPT_ID}",
            "rootDir": "src"
          }
          EOF
        env:
          SCRIPT_ID: ${{ vars.SCRIPT_ID }}

      - name: Push source to GAS
        run: clasp push --force

      - name: Deploy (keep same /exec URL)
        # 既存のデプロイIDを指定して再デプロイ → URLは変わらない
        # 説明文にはマージされたPRのタイトルを使用
        run: clasp deploy -i "$DEPLOYMENT_ID" -d "$PR_TITLE"
        env:
          DEPLOYMENT_ID: ${{ vars.DEPLOYMENT_ID }}
          # インジェクション防止のためenv経由で受け渡し（タイトルに引用符等が含まれても安全）
          PR_TITLE: ${{ github.event.pull_request.title }}
